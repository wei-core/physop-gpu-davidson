[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physop-gpu"
version = "0.1.0"
description = "Portable GPAW packed-Gamma PhysOp GPU Davidson backend"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.10", "ase>=3.22", "gpaw>=25.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
